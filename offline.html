<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1677e8">
  <title>لا يوجد اتصال | كلمات المصطفى للاتصالات</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;
      font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#1c2b3a;
      background:radial-gradient(60% 55% at 50% 35%,#fff 0%,#eaf3ff 60%,#d3e6fb 100%)}
    img{width:min(60vw,240px);height:auto;margin-bottom:18px}
    h1{font-size:clamp(22px,5.5vw,30px);color:#0b4fa8;margin-bottom:8px}
    p{color:#6b7c8f;margin-bottom:24px;line-height:1.8}
    button{border:0;border-radius:50px;padding:12px 32px;background:#1677e8;color:#fff;
      font:700 16px inherit;font-family:inherit;cursor:pointer;transition:transform .15s,background .2s}
    button:hover{background:#0b4fa8}button:active{transform:scale(.95)}
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-512.png" alt="كلمات المصطفى للاتصالات">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تأكد من اتصالك بالشبكة ثم حاول مرة أخرى.<br>سنكون بانتظارك.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
